<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
html, body {
  margin: 0;
  background: #2A2520;
  min-height: 100vh;
  font-family: 'Noto Serif SC', serif;
}
#stage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  position: relative;
}
#stage::before {
  /* desk vignette */
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at center, rgba(60,45,30,0) 30%, rgba(20,15,10,0.45) 100%);
  pointer-events: none;
}
.phone-shell {
  width: 402px;
  height: 874px;
  border-radius: 56px;
  background: #1a1814;
  padding: 12px;
  box-shadow:
    0 0 0 2px #0c0a08,
    0 30px 80px rgba(0,0,0,0.55),
    inset 0 0 0 1px rgba(255,255,255,0.04);
  position: relative;
  z-index: 1;
}
.phone-screen {
  width: 100%;
  height: 100%;
  border-radius: 44px;
  overflow: hidden;
  background: var(--paper, #F0E6D2);
  position: relative;
  isolation: isolate;
}
/* dynamic island */
.phone-shell::after {
  content: '';
  position: absolute;
  top: 22px; left: 50%;
  transform: translateX(-50%);
  width: 112px; height: 32px;
  background: #000;
  border-radius: 18px;
  z-index: 5;
}
/* status bar inside screen */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50px;
  display: flex;
  align-items: flex-end;
  padding: 0 28px 12px;
  justify-content: space-between;
  color: var(--ink, #2C231A);
  font-family: 'SF Pro Display', 'Noto Sans SC', sans-serif;
  font-size: 15px;
  font-weight: 600;
  z-index: 500;
  pointer-events: none;
}
#root {
  width: 100%;
  height: 100%;
  position: relative;
}
.scroll-container {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  padding-top: 50px;
  padding-bottom: 84px; /* clearance for fixed tab bar */
  -webkit-overflow-scrolling: touch;
}
.scroll-container::-webkit-scrollbar { display: none; }

/* Allow internal app to fill */
.dr-app { width: 100%; min-height: 100%; }

@media (max-width: 460px) {
  #stage { padding: 0; }
  .phone-shell {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }
  .phone-screen { border-radius: 0; }
  .phone-shell::after { display: none; }
}
</style>
</head>
<body>

<div id="stage">
  <div class="phone-shell">
    <div class="phone-screen">
      <div class="status-bar">
        <span>9:41</span>
        <span style="display:flex; gap:6px; align-items:center;">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><path d="M1 8.5h2v2H1zM5 6.5h2v4H5zM9 4h2v6.5H9zM13 1.5h2v9h-2z"/></svg>
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 3.5c2-2.5 10-2.5 12 0M4 5.5c1.5-1.5 7-1.5 8.5 0M6 7.5c1-1 3-1 4 0"/><circle cx="8" cy="9.2" r="0.6" fill="currentColor"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="16" height="7" rx="1" fill="currentColor"/><rect x="21" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor"/></svg>
        </span>
      </div>
      <div class="scroll-container" id="scroll-container">
        <div id="root"></div>
      </div>
    </div>
  </div>
</div>

<!-- Data first -->
<script src="data.js"></script>

<!-- Components -->
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="journey.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="book-detail.jsx"></script>
<script type="text/babel" src="onboarding.jsx"></script>

<!-- Tweaks framework (provides global useTweaks, TweaksPanel, etc.) -->
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- App entry -->
<script type="text/babel" src="app.jsx"></script>

</body>
</html>
